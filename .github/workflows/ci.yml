            -DRT64_FREE_DISCARDED_TARGETS=1 -DRT64_GAME_FRAME_WORKLOADS=1 -DRT64_INTERPOLATE_CAMERA_EYE=1
            -DRT64_PACKED_RSP_INPUTS=1 -DRT64_PARTIAL_SCREEN_PAIRS=1 -DRT64_PER_DRAW_TEXTURES=1
            -DRT64_PREBUILT_SHADERS -DRT64_SCISSOR_INSIDE_FRAMEBUFFER=1 -DRT64_SKIP_COLLAPSED_MATCHES=1
            -DRT64_STRETCH_SCREEN_COVERS=1 -DRT64_UNEVEN_FRAME_RATES=1 -DRT64_WGSL=1)
          for dir in src src/contrib src/contrib/plume src/contrib/imgui src/contrib/hlslpp/include src/contrib/stb \
