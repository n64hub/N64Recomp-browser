# Builds and checks the forks at the commits forks.txt names, with this repo's renderer/, frontend/ and tests/. No
# game, so nothing links into a page and nothing draws: a recomp's own CI and runs do that.
#
# A change to nothing but docs (*.md), plays.jsonl, the games' page (site/) and the tools that play, serve and publish
# pages, which CI never runs, skips every job but changes: they report as skipped, not failed, except on a push to main
# when what a page is built from has changed since the newest tag (the tag job). A tag builds everything.
# A green push to main that changes what a page is built from is tagged as the next release (the tag job). The compiles go through ccache (the
# emscripten job, frontend/build_speed.cmake), so a PR whose forks, patches/ and sources are main's mostly hits; the
# cache a PR saves is its own, main's is every PR's.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# A PR's new push cancels its run; a push to main queues behind the one running, so each merge gets its own result.
# GitHub keeps one run waiting per group, so a third merge inside one run still replaces the second's waiting run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NAGA_VERSION: "30.0.1"
  EMSDK_VERSION: "6.0.12"

jobs:
  # Whether anything but docs changed: the PR against its base, a push against the commit before it. A push to main
  # also builds when forks.txt, patches/, frontend/ or renderer/ differ from the newest tag, which the tag job then
  # tags: a docs-only merge right after a code merge whose run never finished would otherwise tag that code unbuilt.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A tag, a new branch or a base that can't be fetched builds everything.
          if [[ "$GITHUB_REF" == refs/tags/* ]] || ! git fetch --depth 1 origin "$BASE" ||
             ! files="$(git diff --name-only "$BASE" HEAD)"; then
            echo code=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          code=false
          if grep -qvE '\.md$|^tools/(page_driver\.mjs|play_page\.mjs|play_phone\.mjs|phone_turn\.mjs|record_shaders\.mjs|publish_(pages?|site)\.sh|serve_site\.mjs|wasm_offset\.mjs)$|^plays\.jsonl$|^site/' <<< "$files"
          then code=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # The same newest tag as the tag job's, and a tag that can't be found or fetched builds everything.
            if ! last="$(git ls-remote --tags --refs origin | sed -nE 's|.*refs/tags/(v0\.[0-9]+\.0)$|\1|p' | sort -V | tail -1)" ||
               [[ -z "$last" ]] || ! git fetch --depth 1 origin "refs/tags/$last:refs/tags/$last" ||
               ! git diff --quiet "$last" HEAD -- forks.txt patches frontend renderer
            then echo "forks.txt, patches/, frontend/ or renderer/ differ from ${last:-the newest tag}."; code=true
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # plume's device thread (tests/plume_device_thread_test.cpp) against a mock backend, natively.
  plume-device-thread:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: plume
        run: |
          bash tools/fetch_forks.sh lib --no-submodules rt64
          git -C lib/rt64 submodule update --init --depth 1 src/contrib/plume
      - name: Test
        run: |
          dpkg -s libx11-dev > /dev/null 2>&1 || sudo apt-get install -y --no-install-recommends libx11-dev
          g++ -std=c++20 -O2 -Wall -pthread -Ilib/rt64/src/contrib/plume tests/plume_device_thread_test.cpp \
            lib/rt64/src/contrib/plume/plume_device_thread.cpp -o device_thread_test
          ./device_thread_test

  # hlslpp's WebAssembly SIMD backend, the one every build with -msimd128 uses for RT64's matrices on the CPU, against
  # the same math in plain C++ (tests/hlslpp_wasm_test.cpp), in node.
  hlslpp-wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: hlslpp
        run: |
          bash tools/fetch_forks.sh lib --no-submodules rt64
          git -C lib/rt64 submodule update --init --depth 1 src/contrib/hlslpp
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Test
        run: |
          em++ -O2 -std=c++17 -msimd128 -Ilib/rt64/src/contrib/hlslpp/include tests/hlslpp_wasm_test.cpp -o hlslpp_wasm_test.js
          node hlslpp_wasm_test.js

  # RT64's shaders as WebGPU gets them: rt64 configured natively with RT64_WGSL builds each one with dxc and naga, and
  # tests/wgsl_check.mjs checks every one against a core WebGPU device in headless Chrome. The runner has no GPU, so
  # Chrome's WebGPU runs on SwiftShader (Vulkan on the CPU), which has no dual-source blending: the checker skips the
  # *DualSource variants, which naga still validates as it writes them. Only the shaders are built, not the library.
  wgsl:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Every source of the library has to exist for CMake to generate, though only the shaders are built.
      - name: rt64
        run: bash tools/fetch_forks.sh lib rt64
      - uses: actions/cache@v4
        id: naga
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: naga
        if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked
      # No apt: the mirror trickles often enough that installing SDL2's, X11's and D-Bus's headers took 2-12 minutes in
      # a third of this job's runs. ninja comes from its own releases, and rt64's configure, which looks for SDL2, X11
      # and Xrandr, and D-Bus (nativefiledialog's portal) though no shader uses any of them, gets an empty stand-in for
      # each: nothing is linked, and no file of the shaders includes their headers. A static rt64 with
      # CMAKE_OPTIMIZE_DEPENDENCIES builds its shaders without first building the libraries it links (nativefiledialog's
      # portal would need D-Bus's real headers).
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.0"
      - name: Build the shaders to WGSL
        run: |
          stubs="$RUNNER_TEMP/stubs"
          mkdir -p "$stubs"
          echo 'set(SDL2_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}")' > "$stubs/SDL2Config.cmake"
          printf 'Name: dbus-1\nDescription: stand-in\nVersion: 1.14.10\n' > "$stubs/dbus-1.pc"
          PKG_CONFIG_PATH="$stubs" cmake -S lib/rt64 -B rt64-wgsl -G Ninja -DRT64_WGSL=ON \
            -DRT64_NAGA_EXECUTABLE="$HOME/.cargo/bin/naga" -DRT64_STATIC=ON -DCMAKE_OPTIMIZE_DEPENDENCIES=ON \
            -DNFD_PORTAL=ON -DSDL2_DIR="$stubs" \
            -DX11_X11_INCLUDE_PATH="$stubs" -DX11_X11_LIB="$stubs/libX11.so" \
            -DX11_Xrandr_INCLUDE_PATH="$stubs" -DX11_Xrandr_LIB="$stubs/libXrandr.so"
          ninja -C rt64-wgsl $(ninja -C rt64-wgsl -t targets all | grep -E '^[^:]+\.wgsl\.c:' | cut -d: -f1)
          find rt64-wgsl -name '*.wgsl' | wc -l
      # The checker uses Node's own WebSocket (22 and up).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check them against core WebGPU
        env:
          CHROME_FLAGS: --enable-unsafe-swiftshader --use-webgpu-adapter=swiftshader --enable-features=Vulkan --no-sandbox
        run: |
          google-chrome --version
          CHROME="$(command -v google-chrome)" node tests/wgsl_check.mjs "$(dirname "$(find rt64-wgsl -name '*.wgsl' | head -1)")"

  # The patches (patches/) are the forks at forks.txt's commits, and patches/apply.cmake patches every recomp's own
  # upstream commits in patches/pins.txt with them, and merges their later change into files a recomp leaves out.
  patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # the patches as an older commit made them
      - name: The patches match the forks
        run: |
          bash tools/export_patches.sh "$RUNNER_TEMP/forks"
          git diff --exit-code --stat -- patches/ || { echo "run tools/export_patches.sh and commit patches/"; exit 1; }
      - name: They apply to every recomp's commits
        run: |
          for recomp in $(grep -v '^#' patches/pins.txt | awk '{ print $1 }' | sort -u); do
            bash tools/fetch_pins.sh "$RUNNER_TEMP/pins/$recomp" "$recomp"
            cmake -P patches/apply.cmake "$RUNNER_TEMP/pins/$recomp"   # a second time changes nothing
          done
      # A recomp that leaves files out and makes the web's change to them its own way takes what the web has changed in
      # them since its merge with apply.cmake --since. On a recomp pinned at upstream's own commits: rt64 and the
      # runtime as the oldest commit on those commits patched them, every file merged forward, are patched as now. On a
      # recomp still pinned at an upstream commit patches.txt has moved from, merged forward from the last commit on it,
      # too: upstream's change between the two is taken out of the merge, or it would bring lines the recomp's own
      # runtime doesn't have (a signature, a member) and fail to compile, which no step here does.
      - name: Files left out take the web's later change to them
        run: |
          merge() {   # <name> <upstream commit a recomp pins> <commit whose patch it was patched with>
            local name=$1 on=$2 from=$3
            local recomp=$(awk -v n=$name -v b=$on '$2 == n && $4 == b { print $1; exit }' patches/pins.txt)
            local files=$( (git show "$from:patches/$name.patch"; cat patches/$name.patch) | sed -n 's|^diff --git a/\([^ ]*\) .*|\1|p' | sort -u)
            local patched="$RUNNER_TEMP/pins/$recomp/$name" since="$RUNNER_TEMP/since/$name-$on"
            echo "$name at ${on:0:7} ($recomp), merged since ${from:0:7}"
            mkdir -p "$RUNNER_TEMP/since" && cp -r "$patched" "$since"
            git -C "$since" reset -q --hard && git -C "$since" clean -fdq
            git show "$from:patches/$name.patch" | git -C "$since" apply --whitespace=nowarn
            cmake -P patches/apply.cmake $name "$since" --since "$from" $files
            cmake -P patches/apply.cmake $name "$since" --since "$from" $files   # a second time changes nothing
            diff <(git -C "$patched" diff) <(git -C "$since" diff) || { echo "$name: merged since ${from:0:7} isn't patched as now"; exit 1; }
          }
          for name in rt64 N64ModernRuntime; do
            base=$(awk -v n=$name '$1 == n { print $4 }' patches/patches.txt)
            merge $name $base $(git log --reverse --format=%H -S"$base" -- patches/patches.txt | head -1)
            for old in $(awk -v n=$name -v b=$base '$2 == n && $4 != b { print $4 }' patches/pins.txt | sort -u); do
              moved=$(git log -1 --format=%H -S"$old" -- patches/patches.txt)
              if [[ -n $moved ]] && git show "$moved^:patches/patches.txt" | awk -v n=$name -v o=$old '$1 == n && $4 == o { f = 1 } END { exit !f }'; then
                merge $name $old $(git rev-parse "$moved^")
              fi
            done
          done

  # The patches over Diddy Kong Racing's web fork's own patches (DKR-R-web, its main): its build applies DKR-R's patches
  # to N64ModernRuntime and rt64 first, then patches/apply.cmake but for the files it leaves to DKR-R's, then more of
  # DKR-R's at configure time, so its checkouts aren't upstream's commits and pins.txt can't name them. Its
  # scripts/build_web.sh --patches does all three without a ROM, with this checkout as its lib/N64Recomp-browser. Red
  # on a PR that keeps main's patches means DKR-R-web's main stopped applying them, which is fixed there.
  dkr-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        id: naga
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: naga
        if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.0"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: SPIRV-Tools
        run: sudo apt-get install -y --no-install-recommends spirv-tools
      - name: They apply over DKR-R-web's
        run: |
          git clone -q --depth 1 https://github.com/n64hub/DKR-R-web "$RUNNER_TEMP/dkr"
          git -C "$RUNNER_TEMP/dkr" log -1 --format='DKR-R-web %h %s'
          rmdir "$RUNNER_TEMP/dkr/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dkr/lib/N64Recomp-browser"
          PATH="$HOME/.cargo/bin:$PATH" bash "$RUNNER_TEMP/dkr/scripts/build_web.sh" --patches

  # The patches over Conker's web fork's own (CBFD-Recompiled-web, its main): its build.sh applies its recomp/*.patch to
  # N64Recomp, N64ModernRuntime, rt64 and RecompFrontend first, then its tools/web_patch.sh puts patches/apply.cmake's
  # on top but for the files it leaves to its own tools/web_*.patch, so its checkouts aren't upstream's commits either.
  # This does both without a ROM, with this checkout as its tools/N64Recomp-browser. Red on a PR that keeps main's
  # patches means CBFD-Recompiled-web's main stopped applying them, which is fixed there.
  cbfd-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: They apply over CBFD-Recompiled-web's
        run: |
          cbfd="$RUNNER_TEMP/cbfd"
          git clone -q --depth 1 https://github.com/n64hub/CBFD-Recompiled-web "$cbfd"
          git -C "$cbfd" log -1 --format='CBFD-Recompiled-web %h %s'
          git -C "$cbfd" -c protocol.version=2 submodule update -q --init --depth 1 --jobs 4             tools/N64Recomp tools/N64ModernRuntime tools/rt64 tools/RecompFrontend
          git -C "$cbfd/tools/rt64" -c protocol.version=2 submodule update -q --init --depth 1 src/contrib/plume src/contrib/hlslpp
          git -C "$cbfd/tools/N64ModernRuntime" -c protocol.version=2 submodule update -q --init --depth 1 N64Recomp
          for tool in N64Recomp N64ModernRuntime rt64 RecompFrontend; do
            git -C "$cbfd/tools/$tool" apply "$cbfd/recomp/$(echo "$tool" | tr A-Z a-z).patch"
          done
          rmdir "$cbfd/tools/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$cbfd/tools/N64Recomp-browser"
          sh "$cbfd/tools/web_patch.sh"

  # The patches under Jet Force Gemini's web fork's own (JetForceGemini-Recomp-web, its main): its tools/build_web.sh
  # puts patches/apply.cmake's on upstream's commits, then its patches/web/*.patch, the base project's rt64 and runtime
  # changes made again for them, on top, so a change here to the lines those touch stops its page building. Its
  # --patches does the whole patch step without a ROM, with this checkout as its lib/N64Recomp-browser. Red on a PR that
  # keeps main's patches means JetForceGemini-Recomp-web's main stopped applying over them, which is fixed there. Then
  # rt64's files that include ImGui are compiled against the port's own ImGui (below).
  jfg-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JetForceGemini-Recomp-web's apply over them
        run: |
          jfg="$RUNNER_TEMP/jfg"
          git clone -q --depth 1 https://github.com/n64hub/JetForceGemini-Recomp-web "$jfg"
          git -C "$jfg" log -1 --format='JetForceGemini-Recomp-web %h %s'
          rmdir "$jfg/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$jfg/lib/N64Recomp-browser"
          bash "$jfg/tools/build_web.sh" --patches
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      # The port's rt64 pins a newer ImGui than upstream's (1.93 against 1.90), and the web support's code in rt64 is
      # otherwise compiled only against upstream's: each of its files that includes ImGui is compiled here, as a page
      # compiles it (syntax only: no shaders are built), against the port's patched rt64 and its ImGui.
      - name: rt64's ImGui code against the port's ImGui
        run: |
          rt64="$RUNNER_TEMP/jfg/web-build/lib/rt64"
          flags=(-std=c++17 -pthread -fwasm-exceptions -msimd128 -sUSE_SDL=2 --use-port=emdawnwebgpu -fsyntax-only
            -DFFX_GCC -DHLSL_CPU -DIMGUI_IMPL_VULKAN_NO_PROTOTYPES -DRT64_FREE_DISCARDED_TARGETS=1
            -DRT64_GAME_FRAME_WORKLOADS=1 -DRT64_PACKED_RSP_INPUTS=1 -DRT64_PREBUILT_SHADERS -DRT64_UNEVEN_FRAME_RATES=1
            -DRT64_WGSL=1 "-DXXH_HAS_INCLUDE(x)=0")
          for dir in src src/contrib src/contrib/plume src/contrib/imgui src/contrib/hlslpp/include \
            src/contrib/mupen64plus-core/src/api src/contrib/nativefiledialog-extended/src/include \
            src/contrib/re-spirv/external/SPIRV-Headers/include src/contrib/zstd/lib src/contrib/plume/contrib/volk \
            src/contrib/plume/contrib/Vulkan-Headers/include src/contrib/plume/contrib/VulkanMemoryAllocator/include; do
            flags+=("-I$rt64/$dir")
          done
          grep -E '#define IMGUI_VERSION ' "$rt64/src/contrib/imgui/imgui.h"
          cd "$rt64"
          grep -rl --include='*.cpp' imgui src | grep -v '^src/contrib/' | sort | while read -r file; do
            echo "$file"
            em++ "${flags[@]}" "$file"
          done

  # The patches under Pokémon Snap's web fork's own (Snap64Recomp-web, its main), on its port's own rt64 and
  # N64ModernRuntime (their snap64 branches): its tools/build_web.sh leaves out the files where the port's lines and the
  # web's meet, applies its patches/web/*.patch to them, and merges in the web's change to them since with apply.cmake
  # --since. Its --patches does that step without a ROM, with this checkout as its lib/N64Recomp-browser. Red on a PR
  # means the PR's web change meets the port's own lines in one of them, or in a file it doesn't leave out yet: it is
  # merged into Snap64Recomp-web's patches/web by hand (its files.txt says how), in that PR's work.
  snap-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snap64Recomp-web's apply over them
        run: |
          snap="$RUNNER_TEMP/snap"
          git clone -q --depth 1 https://github.com/n64hub/Snap64Recomp-web "$snap"
          git -C "$snap" log -1 --format='Snap64Recomp-web %h %s'
          git -C "$snap" -c protocol.version=2 submodule update -q --init --depth 1 --jobs 2 lib/rt64 lib/N64ModernRuntime
          git -C "$snap/lib/rt64" -c protocol.version=2 submodule update -q --init --depth 1 src/contrib/plume src/contrib/hlslpp
          git -C "$snap/lib/N64ModernRuntime" -c protocol.version=2 submodule update -q --init --depth 1 N64Recomp
          rmdir "$snap/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$snap/lib/N64Recomp-browser"
          bash "$snap/tools/build_web.sh" --patches

  # The patches under Rush 2's web fork's own (rush2recompiled-web, its main), as Snap64Recomp-web's: its
  # tools/build_web.sh applies Rush 2's lib/patches to rt64, N64ModernRuntime and RecompFrontend first, then these but for
  # the files its web/patches/*.patch take over, with the web's change to them since merged in by apply.cmake --since.
  # Red on a PR means the same as snap-patches', merged into rush2recompiled-web's web/patches by hand.
  rush2-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: rush2recompiled-web's apply over them
        run: |
          rush2="$RUNNER_TEMP/rush2"
          git clone -q --depth 1 https://github.com/n64hub/rush2recompiled-web "$rush2"
          git -C "$rush2" log -1 --format='rush2recompiled-web %h %s'
          git -C "$rush2" -c protocol.version=2 submodule update -q --init --depth 1 --jobs 3 \
            lib/rt64 lib/N64ModernRuntime lib/RecompFrontend
          git -C "$rush2/lib/rt64" -c protocol.version=2 submodule update -q --init --depth 1 src/contrib/plume src/contrib/hlslpp
          git -C "$rush2/lib/N64ModernRuntime" -c protocol.version=2 submodule update -q --init --depth 1 N64Recomp
          rmdir "$rush2/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$rush2/lib/N64Recomp-browser"
          bash "$rush2/tools/build_web.sh" --patches

  # The patches under 1080° Snowboarding's web fork's own (1080-Snowboarding-recomp-web, its main), as
  # Snap64Recomp-web's: its rt64, hlslpp, N64Recomp and RecompFrontend are newer than the patches' upstream commits and
  # carry the game's own patches, so its web/patches take over the files where the two meet. Red on a PR means the same
  # as snap-patches', merged into 1080-Snowboarding-recomp-web's web/patches by hand.
  snowboarding-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 1080-Snowboarding-recomp-web's apply over them
        run: |
          game="$RUNNER_TEMP/1080"
          git clone -q --depth 1 https://github.com/n64hub/1080-Snowboarding-recomp-web "$game"
          git -C "$game" log -1 --format='1080-Snowboarding-recomp-web %h %s'
          git -C "$game" -c protocol.version=2 submodule update -q --init --depth 1 --jobs 3 \
            lib/rt64 lib/N64ModernRuntime lib/RecompFrontend
          git -C "$game/lib/rt64" -c protocol.version=2 submodule update -q --init --depth 1 src/contrib/plume src/contrib/hlslpp
          git -C "$game/lib/N64ModernRuntime" -c protocol.version=2 submodule update -q --init --depth 1 N64Recomp
          rmdir "$game/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$game/lib/N64Recomp-browser"
          bash "$game/tools/build_web.sh" --patches

  # The patches over Banjo-Tooie's web fork's own (BanjoTooieRecompiled-web, its main): its tools/build_web.sh applies
  # its patches/*.patch to rt64, N64ModernRuntime and N64Recomp first (tools/setup_deps.py), then these on top but for
  # the files it leaves to its own, so a change here to the lines its own patches touch stops its page building. Its
  # --patches does that step without a ROM, with this checkout as its lib/N64Recomp-browser. Red on a PR that keeps
  # main's patches means BanjoTooieRecompiled-web's main stopped applying them; red on one that changes them means the
  # change meets the port's own lines, which are moved apart (in the fork's patches/ or the change) in that PR's work.
  bt-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: BanjoTooieRecompiled-web's and these apply
        run: |
          bt="$RUNNER_TEMP/bt"
          git clone -q --depth 1 https://github.com/n64hub/BanjoTooieRecompiled-web "$bt"
          git -C "$bt" log -1 --format='BanjoTooieRecompiled-web %h %s'
          git -C "$bt" -c protocol.version=2 submodule update -q --init --depth 1 --jobs 4 \
            lib/N64Recomp lib/N64ModernRuntime lib/rt64 lib/RecompFrontend
          git -C "$bt/lib/rt64" -c protocol.version=2 submodule update -q --init --depth 1 src/contrib/plume src/contrib/hlslpp
          git -C "$bt/lib/N64ModernRuntime" -c protocol.version=2 submodule update -q --init --depth 1 N64Recomp
          rmdir "$bt/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$bt/lib/N64Recomp-browser"
          bash "$bt/tools/build_web.sh" --patches

  # The patches under Wave Race 64's web fork's own (wave-race-64-recomp-web, its main): its tools/web_patch.sh applies
  # these to its rt64, N64ModernRuntime and RecompFrontend first, then its own tools/patch_*.py scripts, the last of which
  # (patch_rt64_water.py) applies tools/patches/rt64-water-web.patch, a diff of the web-patched rt64 tree. So any change
  # here beside that patch's lines stops git apply, and the page stops building. Run with this checkout as its
  # lib/N64Recomp-browser; it needs no ROM. Red on a PR means the water patch (or one of the port's scripts' anchors) is
  # made again over the new patches in wave-race-64-recomp-web, in that PR's work.
  wr-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: wave-race-64-recomp-web's apply over them
        run: |
          wr="$RUNNER_TEMP/wr"
          git clone -q --depth 1 https://github.com/n64hub/wave-race-64-recomp-web "$wr"
          git -C "$wr" log -1 --format='wave-race-64-recomp-web %h %s'
          git -C "$wr" -c protocol.version=2 submodule update -q --init --depth 1 --jobs 3             lib/RT64 lib/N64ModernRuntime lib/RecompFrontend
          git -C "$wr/lib/RT64" -c protocol.version=2 submodule update -q --init --depth 1 src/contrib/plume src/contrib/hlslpp
          git -C "$wr/lib/N64ModernRuntime" -c protocol.version=2 submodule update -q --init --depth 1 N64Recomp
          rmdir "$wr/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$wr/lib/N64Recomp-browser"
          bash "$wr/tools/web_patch.sh"

  # Super Mario 64's own changes over the patches (super-mario-64-recomp, its main): its CMakeLists.txt applies its
  # runtime-patches/<project>-<n>-*.patch to its upstream submodules after patches/apply.cmake, and they change files
  # the patches change too (RecompFrontend's renderer). Each project a patch is for is patched here as there, and the
  # game's patches go on top. Red on a PR means one stopped applying: it is made again over the new patches in the
  # game's repo, in that PR's work.
  sm64-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: super-mario-64-recomp's apply over them
        run: |
          sm64="$RUNNER_TEMP/sm64"
          git clone -q --depth 1 https://github.com/n64hub/super-mario-64-recomp "$sm64"
          git -C "$sm64" log -1 --format='super-mario-64-recomp %h %s'
          for patch in $(ls "$sm64"/runtime-patches/*.patch | sort); do
            project=$(basename "$patch" | sed 's/-[0-9]*-.*//')
            if [ ! -e "$sm64/lib/$project/.git" ]; then
              git -C "$sm64" -c protocol.version=2 submodule update -q --init --depth 1 "lib/$project"
              cmake -P patches/apply.cmake "$project" "$sm64/lib/$project"
            fi
            git -C "$sm64/lib/$project" apply --whitespace=nowarn "$patch"
            echo "$(basename "$patch") applies"
          done

  # F-Zero X's own changes over the patches (f-zero-x-recomp, its main), as Super Mario 64's above: its
  # runtime-patches/apply.cmake applies the patches, then its runtime-patches/<project>-<n>-*.patch (RT64 drawing the
  # game's own microcode, F3DFLX2), to its upstream submodules, and they change files the patches change too (RT64's
  # display list commands, RSP and frame matching). Red on a PR means one stopped applying: it is made again over the
  # new patches in the game's repo, in that PR's work.
  fzx-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: f-zero-x-recomp's apply over them
        run: |
          fzx="$RUNNER_TEMP/fzx"
          git clone -q --depth 1 https://github.com/n64hub/f-zero-x-recomp "$fzx"
          git -C "$fzx" log -1 --format='f-zero-x-recomp %h %s'
          for patch in $(ls "$fzx"/runtime-patches/*.patch | sort); do
            project=$(basename "$patch" | sed 's/-[0-9]*-.*//')
            if [ ! -e "$fzx/lib/$project/.git" ]; then
              git -C "$fzx" -c protocol.version=2 submodule update -q --init --depth 1 "lib/$project"
              cmake -P patches/apply.cmake "$project" "$fzx/lib/$project"
            fi
            git -C "$fzx/lib/$project" apply --whitespace=nowarn "$patch"
            echo "$(basename "$patch") applies"
          done

  # Rush 2049's own changes over the patches (rush-2049-recomp, its main): its tools/apply_runtime_patches.sh applies
  # each project's patch here, then its runtime-patches/<project>-<n>-*.patch, and they change lines near the forks'
  # (rt64's GPU timings beside its workload queue, plume's queries, RecompFrontend's input). Each project is checked out
  # at patches.txt's upstream commit, not the game's own pin, so this is what its next pin move builds; the script runs
  # with this checkout as its lib/N64Recomp-browser. Red on a PR means one stopped applying: it is made again over the
  # new patches in the game's repo, in that PR's work.
  rush2049-patches:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: rush-2049-recomp's apply over them
        run: |
          rush="$RUNNER_TEMP/rush2049"
          git clone -q --depth 1 https://github.com/n64hub/rush-2049-recomp "$rush"
          git -C "$rush" log -1 --format='rush-2049-recomp %h %s'
          grep -v '^#' patches/patches.txt | grep . | while read -r name path fork commit; do
            dir="$rush/lib/$path"
            mkdir -p "$dir" && git -C "$dir" init -q
            git -C "$dir" -c protocol.version=2 fetch -q --depth 1 "$fork" "$commit"
            git -C "$dir" checkout -q FETCH_HEAD
          done
          rmdir "$rush/lib/N64Recomp-browser"
          ln -s "$GITHUB_WORKSPACE" "$rush/lib/N64Recomp-browser"
          bash "$rush/tools/apply_runtime_patches.sh"

  # Every library a page is made of, built with Emscripten (tests/build/CMakeLists.txt): from the forks, and from
  # Banjo-Kazooie's own upstream commits with the patches in.
  emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [forks, Banjo-Kazooie]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # In tests/build/lib, for the header RecompFrontend takes from its game (tests/build/patches/ui_funcs.h).
      - name: ${{ matrix.source }}
        run: |
          if [ "${{ matrix.source }}" = forks ]; then bash tools/fetch_forks.sh tests/build/lib
          else bash tools/fetch_pins.sh tests/build/lib "${{ matrix.source }}" --all-submodules; fi
      - uses: actions/cache@v4
        id: naga
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: naga
        if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked
      # The forks' cmake_minimum_required are older than CMake 4 accepts.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.0"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      # spirv-opt, which rt64 runs on the prebuilt shaders (tests/build/shaders.txt) before naga.
      - name: SPIRV-Tools
        run: sudo apt-get install -y --no-install-recommends spirv-tools
      # Emscripten's cache, where embuilder puts its ports, is in emsdk's folder, cached before they are built. One a leg:
      # a leg's compiles all missed ccache against the other leg's (577 of 578), and hit against its own.
      - id: em-cache
        run: echo "dir=$(em-config CACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.em-cache.outputs.dir }}
          key: em-cache-${{ env.EMSDK_VERSION }}-${{ matrix.source }}-sdl2-mt-freetype-legacysjlj-${{ runner.os }}
      - name: Emscripten's SDL2 and FreeType
        run: embuilder build sdl2-mt freetype-legacysjlj
      # frontend/build_speed.cmake puts ccache in front of every compile once it is on PATH.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: emscripten-${{ matrix.source }}
          max-size: 2G
      - name: Build
        run: |
          emcmake cmake -S tests/build -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFORKS_DIR="$PWD/tests/build/lib" \
            -DRT64_NAGA_EXECUTABLE="$HOME/.cargo/bin/naga"
          ninja -C build web_libraries
      # frontend/'s link options (tests/build/link_check): a page's own -sINITIAL_MEMORY wins, and a call whose signature
      # doesn't match the function's fails the link.
      - name: Link a page
        run: |
          ninja -C build frontend_link_check
          grep -q 1677721600 build/frontend_link_check.js
          if ninja -C build frontend_signature_mismatch > mismatch.log 2>&1; then
            echo "frontend_signature_mismatch linked"; exit 1
          fi
          grep "function signature mismatch: native" mismatch.log
      # frontend/ccache_launcher.cmake: what includes a file a custom command writes into the source tree is rebuilt in
      # the build that writes it (tests/depfile).
      - name: Incremental build
        run: bash tests/depfile/run.sh build-depfile

  # A push to main that changes what a page is built from (forks.txt, patches/, frontend/, renderer/) is tagged
  # v0.<n+1>.0 once its jobs pass: a tag is a release, and the retest builds the newest one, so a change left untagged
  # reaches no page. It compares against the newest tag, not the push before, so a run cancelled by the next merge is
  # covered by that one's, and the changes job builds a docs-only push's whenever this would tag. A tag pushed with
  # GITHUB_TOKEN starts no workflow: this run, on the same commit, is its CI.
  tag:
    needs: [changes, plume-device-thread, hlslpp-wasm, wgsl, patches, dkr-patches, cbfd-patches, jfg-patches, snap-patches,
      rush2-patches, snowboarding-patches, bt-patches, wr-patches, sm64-patches, fzx-patches, rush2049-patches, emscripten]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          last="$(git tag -l 'v0.*.0' --sort=-v:refname | head -1)"
          if git diff --quiet "$last" HEAD -- forks.txt patches frontend renderer; then
            echo "Nothing a page is built from has changed since $last."; exit 0
          fi
          minor="${last#v0.}"; next="v0.$(( ${minor%%.*} + 1 )).0"
          {
            echo "$next"; echo
            # Each merge's pull request title, its message's body.
            for c in $(git rev-list --first-parent "$last"..HEAD); do
              title="$(git log -1 --format=%b "$c" | head -1)"
              echo "- ${title:-$(git log -1 --format=%s "$c")}"
            done
          } > tag-message.txt
          cat tag-message.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -F tag-message.txt
          git push origin "$next"
